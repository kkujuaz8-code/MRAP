<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRAP 프로 포트폴리오</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

    <!-- 로그인 화면 -->
    <div id="loginScreen" class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
            <h3 class="text-center mb-4">🔒 MRAP 로그인</h3>
            <div class="mb-3">
                <input type="text" id="loginId" class="form-control" placeholder="아이디" value="testuser">
            </div>
            <div class="mb-3">
                <input type="password" id="password" class="form-control" placeholder="비밀번호" value="password123!">
            </div>
            <!-- 로그인 및 회원가입 버튼 영역 -->
            <div class="d-grid gap-2 mt-4">
                <button class="btn btn-primary w-100 fw-bold" onclick="login()">로그인</button>
                <button class="btn btn-outline-secondary w-100" onclick="openSignupModal()">회원가입</button>
            </div>
        </div>
    </div>

    <!-- 대시보드 화면 -->
    <div id="dashboardScreen" class="container py-5 d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold m-0">📈 나의 주식 포트폴리오</h2>
            <div>
                <button class="btn btn-outline-danger btn-sm px-3 fw-bold me-2" onclick="logout()">로그아웃</button>
                <button class="btn btn-danger btn-sm px-3 fw-bold" onclick="withdrawAccount()">회원 탈퇴 ⚠️</button>
            </div>
        </div>
        
        <!-- 검색 및 실시간 랭킹 영역 -->
        <div class="row g-4 mb-4">
            <!-- 종목 검색 -->
            <div class="col-md-5">
                <div class="card shadow-sm h-100 border-0 bg-white">
                    <div class="card-body">
                        <h5 class="fw-bold mb-3">🔍 종목 검색</h5>
                        <div class="input-group">
                            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="티커 입력 (예: TSLA)">
                            <button class="btn btn-dark" onclick="searchStock()">차트 열기</button>
                        </div>
                        <p class="text-muted small mt-2 mb-0">티커를 검색하면 즉시 상세 차트와 주문 창이 열립니다.</p>
                    </div>
                </div>
            </div>
            
            <!-- 실시간 랭킹 -->
            <div class="col-md-7">
                <div class="card shadow-sm h-100 border-0 bg-white">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold m-0">🏆 실시간 랭킹 TOP</h5>
                            <div>
                                <button class="btn btn-sm btn-outline-success" id="btnActive" onclick="loadRanking('ACTIVE')">인기(거래량)</button>
                                <button class="btn btn-sm btn-outline-danger active" id="btnRise" onclick="loadRanking('RISE')">급상승</button>
                                <button class="btn btn-sm btn-outline-primary" id="btnFall" onclick="loadRanking('FALL')">급하락</button>
                            </div>
                        </div>
                        <div id="rankingList" style="max-height: 150px; overflow-y: auto; overflow-x: hidden;"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row g-4">
            <!-- 자산 요약 카드 -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100 border-0 bg-white">
                    <div class="card-body text-center">
                        <h5 class="text-muted">총 투자 원금</h5>
                        <h3 id="invested" class="mb-0">0 <small class="text-muted fs-6">USD</small></h3>
                        <p id="investedKrw" class="text-muted small mt-1 mb-0">(약 0 원)</p>
                        <hr>
                        <h5 class="text-muted">총 평가 금액</h5>
                        <h3 id="totalValue" class="fw-bold mb-0">0 <small class="text-muted fs-6">USD</small></h3>
                        <p id="totalValueKrw" class="text-muted small mt-1 mb-0">(약 0 원)</p>
                        <hr>
                        <h5 class="text-muted">총 수익률</h5>
                        <h3 id="profitRate">0%</h3>
                        
                        <div class="mt-4" style="height: 220px;">
                            <canvas id="portfolioChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 매수 주문 카드 -->
            <div class="col-md-8">
                <div class="card shadow-sm h-100 border-0 bg-white">
                    <div class="card-body">
                        <h5 class="card-title mb-4">🛒 주식 매수 주문</h5>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <input type="text" id="buyTicker" class="form-control form-control-lg" placeholder="티커 (예: AAPL)">
                            </div>
                            <div class="col-md-4">
                                <input type="number" id="buyQty" class="form-control form-control-lg" placeholder="수량 (주)">
                            </div>
                            <div class="col-md-4">
                                <input type="number" id="buyPrice" class="form-control form-control-lg" placeholder="매수 단가 ($)">
                            </div>
                        </div>
                        <button class="btn btn-warning w-100 mt-3 fw-bold fs-5" onclick="buyStock()">매수 주문 전송</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 보유 종목 리스트 -->
        <h4 class="mt-5 mb-3 fw-bold">📊 보유 종목 상세</h4>
        <div class="row" id="stockList"></div>
    </div>

    <!-- 💡 회원가입 전용 모달 창 -->
    <div class="modal fade" id="signupModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">📝 MRAP 회원가입</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- 아이디 & 중복확인 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">아이디</label>
                        <div class="input-group">
                            <input type="text" id="signupId" class="form-control" placeholder="아이디 입력" oninput="resetIdCheck()">
                            <button class="btn btn-outline-primary" type="button" onclick="checkDuplicateId()">중복확인</button>
                        </div>
                        <small id="idCheckMsg" class="form-text"></small>
                    </div>

                    <!-- 비밀번호 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">비밀번호</label>
                        <input type="password" id="signupPw" class="form-control" placeholder="비밀번호 입력" oninput="validatePassword()">
                    </div>

                    <!-- 비밀번호 확인 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">비밀번호 확인</label>
                        <input type="password" id="signupPwConfirm" class="form-control" placeholder="비밀번호 재입력" oninput="validatePassword()">
                        <small id="pwCheckMsg" class="form-text"></small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary fw-bold" id="btnSubmitSignup" onclick="completeSignup()" disabled>가입 완료</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 토스트 알림창 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header text-white" id="toastHeader">
                <strong class="me-auto">알림</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body fw-bold" id="toastBody">
                메시지 내용
            </div>
        </div>
    </div>

    <!-- 주식 상세 차트 & 주문 모달창 -->
    <div id="stockDetailModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5);">
        <div style="background-color: #fff; margin: 5% auto; padding: 20px; border: 1px solid #888; width: 85%; max-width: 1200px; display: flex; border-radius: 10px; position: relative;">
            <span onclick="document.getElementById('stockDetailModal').style.display='none'" style="color: #aaa; position: absolute; right: 20px; top: 10px; font-size: 28px; font-weight: bold; cursor: pointer;">&times;</span>

            <div id="chartArea" style="width: 70%; padding-right: 20px; border-right: 1px solid #ddd;">
                <h2>📈 <span id="modalTickerTitle">AAPL</span> 차트</h2>
                <div class="tradingview-widget-container" style="height: 500px;">
                    <div id="tradingview_chart" style="height: 100%; width: 100%;"></div>
                </div>
            </div>

            <div id="orderArea" style="width: 30%; padding-left: 20px;">
                <h3>빠른 주문</h3>
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold; font-size: 0.9em; color: #555;">매매 단가 ($)</label>
                    <input type="number" id="modalCurrentPrice" step="0.01" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label style="font-weight: bold; font-size: 0.9em; color: #555;">수량 (주)</label>
                    <input type="number" id="tradeQuantity" placeholder="수량 입력" style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
                    <button onclick="executeModalTrade('BUY')" style="width: 48%; background-color: #ff4d4d; color: white; padding: 10px; border: none; cursor: pointer; border-radius: 4px;">매수</button>
                    <button onclick="executeModalTrade('SELL')" style="width: 48%; background-color: #4d79ff; color: white; padding: 10px; border: none; cursor: pointer; border-radius: 4px;">매도</button>
                </div>
                <hr>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4>🧾 내 거래 내역</h4>
                    <button onclick="clearAllHistory()" style="background-color: transparent; border: 1px solid red; color: red; padding: 5px 10px; cursor: pointer; border-radius: 5px;">전체 초기화 💣</button>
                </div>
                <div style="height: 250px; overflow-y: auto; background-color: #f9f9f9; padding: 10px; border-radius: 5px; margin-top: 10px;">
                    <ul id="historyList" style="list-style: none; padding: 0; margin: 0;"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
